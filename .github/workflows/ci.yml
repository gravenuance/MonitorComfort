name: CI

on:
  # Branches only: a version tag is built and tested by the release workflow.
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Release is the verification configuration: analyzers on, warnings as errors.
      - name: Build
        run: dotnet build MonitorComfort.slnx -c Release

      - name: Test
        run: dotnet run --project tests/MonitorComfort.Tests -c Release --no-build
