name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Release is the verification configuration: analyzers on, warnings as errors.
      - name: Build
        run: dotnet build MonitorComfort.slnx -c Release

      - name: Test
        run: dotnet run --project tests/MonitorComfort.Tests -c Release --no-build
